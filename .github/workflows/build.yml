name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            gcc-multilib \
            nasm \
            grub-pc-bin \
            grub-common \
            grub-efi-amd64-bin \
            xorriso \
            mtools \
            qemu-system-x86

      - name: Build kernel ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Locate build artifact
        id: artifact
        run: |
          ISO=$(find . -maxdepth 3 -iname '*.iso' | head -n1)
          if [ -z "$ISO" ]; then
            echo "No .iso produced by build.sh" >&2
            exit 1
          fi
          echo "iso_path=$ISO" >> "$GITHUB_OUTPUT"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: osmanthus-iso
          path: ${{ steps.artifact.outputs.iso_path }}

      - name: Smoke test boot in QEMU
        run: |
          timeout 20s qemu-system-i386 \
            -cdrom "${{ steps.artifact.outputs.iso_path }}" \
            -serial file:serial_output.log \
            -display none \
            -no-reboot || true
          echo "----- Serial output -----"
          cat serial_output.log || echo "(no serial output captured)"

      - name: Check for boot markers in serial log
        run: |
          # These prove the kernel booted all the way to the interactive shell.
          # Treated as required -- if either is missing, something crashed or hung.
          REQUIRED_MARKERS=(
            "OSMANTHUS OS NATIVE COMPOSITOR SHELL"
            "Osmanthus OS >"
          )

          # Informational only: subsystem init messages. Logged for visibility,
          # but their exact wording changes as the kernel evolves, so a miss
          # here doesn't fail the build on its own.
          INFO_MARKERS=(
            "GDT Layout Initialization"
            "IDT Core Handlers Activated"
            "Keyboard Driver Initialization"
            "PIT Timer"
            "Kernel Dynamic Heap System"
            "Physical Memory Manager"
            "Virtual Memory Manager"
            "Task Management System"
          )

          echo "--- Subsystem init markers (informational) ---"
          for marker in "${INFO_MARKERS[@]}"; do
            if grep -qF "$marker" serial_output.log; then
              echo "PASS: $marker"
            else
              echo "MISSING: $marker"
            fi
          done

          echo ""
          echo "--- Required markers (build fails if missing) ---"
          FAILED=0
          for marker in "${REQUIRED_MARKERS[@]}"; do
            if grep -qF "$marker" serial_output.log; then
              echo "PASS: $marker"
            else
              echo "MISSING: $marker"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "----- Full serial log (for debugging) -----"
            cat serial_output.log || echo "(log file empty or missing)"
            echo "---------------------------------------------"
            echo "Kernel did not reach the interactive shell."
            exit 1
          fi

          echo ""
          echo "Boot smoke test passed: kernel reached the interactive shell."

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: serial_output.log
